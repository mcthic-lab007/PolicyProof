name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Offline: no Meta API key is configured and no test calls the network.
      # Two tests replay a saved live Muse Spark response that is git-ignored
      # (artifacts/); they are reported as skipped here, never as passed.
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -t . -v
